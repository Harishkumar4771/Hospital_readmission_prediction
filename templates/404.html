<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedPredict — Page Not Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #080D1A; --bg2: #0D1426; --border: rgba(255,255,255,0.07);
      --teal: #00D4A8; --white: #F0F4FF; --muted: rgba(240,244,255,0.5);
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans: 'DM Sans', system-ui, sans-serif;
      --nav-h: 68px; --radius: 12px; --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--white); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 24px; position: relative; overflow: hidden; }
    body::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(0,212,168,0.07) 1px, transparent 1px); background-size: 32px 32px; pointer-events: none; }
    .code { font-family: var(--font-serif); font-size: clamp(6rem, 20vw, 10rem); font-weight: 700; color: var(--teal); line-height: 1; margin-bottom: 16px; opacity: 0.2; letter-spacing: -0.04em; }
    .icon { width: 80px; height: 80px; background: rgba(0,212,168,0.1); border: 1px solid rgba(0,212,168,0.2); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 28px; font-size: 30px; color: var(--teal); }
    h1 { font-family: var(--font-serif); font-size: clamp(1.6rem, 3vw, 2.4rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 0.95rem; max-width: 400px; line-height: 1.75; margin-bottom: 36px; }
    .actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; background: var(--teal); color: var(--bg); text-decoration: none; font-weight: 600; font-size: 0.9rem; padding: 12px 24px; border-radius: var(--radius); transition: var(--transition); }
    .btn-primary:hover { background: #00f0c0; transform: translateY(-2px); }
    .btn-outline { display: inline-flex; align-items: center; gap: 8px; background: transparent; color: var(--muted); border: 1px solid var(--border); text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 12px 22px; border-radius: var(--radius); transition: var(--transition); }
    .btn-outline:hover { color: var(--white); border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }
    .brand { position: absolute; top: 28px; left: 40px; display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--white); font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; }
    .brand-icon { width: 30px; height: 30px; background: var(--teal); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: var(--bg); font-size: 14px; }
  </style>
</head>
<body>
  <a href="/" class="brand"><div class="brand-icon"><i class="fa-solid fa-heart-pulse"></i></div> MedPredict</a>
  <div class="code">404</div>
  <div class="icon"><i class="fa-solid fa-map-location-dot"></i></div>
  <h1>Page not found.</h1>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
  <div class="actions">
    <a href="/" class="btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
    <a href="/predictor" class="btn-outline"><i class="fa-solid fa-stethoscope"></i> Run a Prediction</a>
  </div>
</body>
</html>
