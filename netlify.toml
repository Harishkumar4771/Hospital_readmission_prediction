[build]
  command = "pip install -r requirements.txt"
  functions = "functions"
  publish = "."

[functions]
  directory = "functions"
  python_version = "3.11"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200

[dev]
  command = "python app.py"
  port = 5000
  autolaunch = false
